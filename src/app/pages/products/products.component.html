<div class="container">
  <div class="section-header" data-aos="fade-up">
    <h2>Our Products</h2>
    <p>Quality security, communication, and networking equipment</p>
  </div>

  <!-- Category Filter -->
  <div class="filter-bar text-center mb-4" data-aos="fade-up">
    <button *ngFor="let cat of categories" 
            class="btn filter-btn" 
            [ngClass]="{ active: activeCategory === cat.key }" 
            (click)="setCategory(cat.key)">
      {{ cat.label }}
    </button>
  </div>

  <!-- Products Grid -->
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let product of filteredProducts; let i = index" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(i % 3) * 100">
      <div class="card product-card h-100 border-0">
        <div class="product-image" *ngIf="product.image">
          <img [src]="product.image" [alt]="product.name" loading="lazy">
        </div>
        <div class="product-placeholder" *ngIf="!product.image">
          <i class="bi bi-box-seam"></i>
        </div>
        <div class="card-body p-4">
          <span class="product-category">{{ getCategoryLabel(product.category) }}</span>
          <h5 class="fw-semibold mt-2 mb-2">{{ product.name }}</h5>
          <p class="text-muted small mb-3">{{ product.description }}</p>
          <div class="product-features mb-3">
            <span class="feature-badge" *ngFor="let f of product.features">{{ f }}</span>
          </div>
          <a href="#" (click)="contactForPricing($event, product.name)" class="btn btn-primary w-100">
            <i class="bi bi-whatsapp me-1"></i> Contact for Pricing
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- No products message -->
  <div class="text-center py-5" *ngIf="filteredProducts.length === 0">
    <p class="text-muted">No products found in this category.</p>
  </div>
</div>
