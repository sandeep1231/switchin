<div class="container">
  <div class="section-header" data-aos="fade-up">
    <h2>Client Testimonials</h2>
    <p>What our clients say about working with Switchin Solutions</p>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let t of testimonials; let i = index" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(i % 3) * 100">
      <div class="card testimonial-card h-100 border-0 p-4">
        <div class="quote-icon"><i class="bi bi-quote"></i></div>
        <p class="testimonial-text">{{ t.text }}</p>
        <div class="testimonial-author mt-auto pt-3">
          <div class="author-avatar">
            {{ t.name.charAt(0) }}
          </div>
          <div class="author-info">
            <strong>{{ t.name }}</strong>
            <span class="text-muted d-block small">{{ t.designation }}</span>
            <div class="stars mt-1">
              <i class="bi bi-star-fill" *ngFor="let star of getStars(t.rating)"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div class="text-center mt-5 pt-3" data-aos="fade-up">
    <p class="text-muted mb-3">Ready to experience our trusted services?</p>
    <a href="#contact" class="btn btn-primary btn-lg">
      <i class="bi bi-chat-dots me-1"></i> Get in Touch
    </a>
  </div>
</div>
