<!-- Top Contact Bar -->
<div class="top-bar d-none d-lg-block" [ngClass]="{ 'top-bar-hidden': isShrunk }">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="top-bar-left">
      <span><i class="bi bi-geo-alt-fill"></i> Chandrasekharpur, Bhubaneswar</span>
      <span class="ms-3"><i class="bi bi-envelope-fill"></i> info&#64;switchinsolutions.com</span>
    </div>
    <div class="top-bar-right">
      <a href="tel:+918249762491"><i class="bi bi-telephone-fill"></i> +91 82497 62491</a>
      <span class="mx-2">|</span>
      <a href="tel:+919439463666"><i class="bi bi-telephone-fill"></i> +91 94394 63666</a>
    </div>
  </div>
</div>

<!-- Main Navbar -->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark" [ngClass]="{ 'navbar-shrink': isShrunk }" [style.top.px]="topBarHeight">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/" fragment="home">
      <div class="brand-text">
        <span class="brand-switch">Switch</span><span class="brand-in">In</span>
      </div>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="home" [ngClass]="{ active: currentSection === 'home' }" (click)="collapseMenu()">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="about" [ngClass]="{ active: currentSection === 'about' }" (click)="collapseMenu()">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="services" [ngClass]="{ active: currentSection === 'services' }" (click)="collapseMenu()">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="products" [ngClass]="{ active: currentSection === 'products' }" (click)="collapseMenu()">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/walkie-talkie-rental" (click)="collapseMenu()">Rentals</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="contact" [ngClass]="{ active: currentSection === 'contact' }" (click)="collapseMenu()">Contact</a>
        </li>
        <li class="nav-item ms-lg-3">
          <a class="btn btn-cta" href="#" (click)="getQuote($event)">
            <i class="bi bi-whatsapp me-1"></i> Get a Quote
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
